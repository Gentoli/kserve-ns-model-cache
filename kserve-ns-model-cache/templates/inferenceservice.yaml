{{- $cmName := include "kserve-ns-model-cache.populateConfigMapName" . -}}
{{- $cacheClaim := .Values.cache.pvc.existingClaim | default .Values.cache.pvc.name -}}
{{- $cacheVol := include "kserve-ns-model-cache.cacheVolumeName" . -}}
{{- $scriptVol := include "kserve-ns-model-cache.scriptVolumeName" . -}}
{{- $cacheRoot := .Values.populate.cacheRoot -}}
{{- $scriptMount := .Values.populateScript.mountPath -}}
{{- $image := printf "%s:%s" .Values.populate.image.repository .Values.populate.image.tag -}}
{{- $pullPolicy := .Values.populate.image.pullPolicy -}}
{{- $defaultInitResources := .Values.populate.resources -}}
{{- $hfSecret := .Values.hf.tokenSecret.name -}}
{{- $hfKey := .Values.hf.tokenSecret.key -}}
{{- $hfHome := .Values.populate.hfHome | default (printf "%s/.hf-home" $cacheRoot) -}}
{{- $cc := .Values.vllm.compileCache -}}
{{- $ccEnabled := and $cc.enabled $cc.mountPath -}}
{{- $volumes := list
      (dict "name" $scriptVol "configMap" (dict "name" $cmName))
      (dict "name" $cacheVol "persistentVolumeClaim" (dict "claimName" $cacheClaim))
-}}
{{- /* subPath is the shared cache key: models reusing one must have an
       identical source, or each pod would replace the other's cache. */ -}}
{{- $subPaths := dict -}}
{{- /* A qwen3090 preset's enabled drafter occupies its own cache dir under the
       same key; register it first so no models[] entry (or second runtime's
       drafter) claims that subPath from a different source. */ -}}
{{- range .Values.runtimes -}}
  {{- $d := (.qwen3090 | default dict).drafter | default dict -}}
  {{- if and $d.hfUri $d.subPath (ne ($d.enabled | default true) false) -}}
    {{- $source := printf "hf|%s" $d.hfUri -}}
    {{- if and (hasKey $subPaths $d.subPath) (ne (get $subPaths $d.subPath) $source) -}}
      {{- fail (printf "runtimes[%s] drafter reuses subPath '%s' with a different model source; give each model/quant its own subPath" (.name | default "<unnamed>") $d.subPath) -}}
    {{- else -}}
      {{- $_ := set $subPaths $d.subPath $source -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- range .Values.models -}}
  {{- $source := printf "hf|%s" (.hfUri | default "") -}}
  {{- $gguf := .gguf | default dict -}}
  {{- if and (hasKey $gguf "repo") $gguf.repo -}}
    {{- /* Cache identity is repo-level: multiple quants of the same model may
           share one subPath (each quant file is added and kept). */ -}}
    {{- $source = printf "gguf|%s|%s|%s" $gguf.repo ($gguf.tokenizerRepo | default $gguf.repo) ($gguf.revision | default "") -}}
  {{- end -}}
  {{- if hasKey $subPaths .subPath -}}
    {{- if ne (get $subPaths .subPath) $source -}}
      {{- fail (printf "models[%s] reuses subPath '%s' with a different model source; give each model/quant its own subPath" .name .subPath) -}}
    {{- end -}}
  {{- else -}}
    {{- $_ := set $subPaths .subPath $source -}}
  {{- end -}}
{{- end -}}
{{- range .Values.models }}
{{- $gguf := .gguf | default dict -}}
{{- $isGguf := and (hasKey $gguf "repo") $gguf.repo -}}
{{- if and (not (hasKey $gguf "repo")) (gt (len (keys $gguf)) 0) -}}
  {{- fail (printf "models[%s].gguf.repo is required" .name) -}}
{{- end -}}
{{- if $isGguf -}}
  {{- if not $gguf.quant -}}
    {{- fail (printf "models[%s].gguf.quant is required" .name) -}}
  {{- end -}}
{{- end -}}
{{- /* populate init container (chart-managed) */ -}}
{{- $env := list
      (dict "name" "CACHE_ROOT" "value" $cacheRoot)
      (dict "name" "HF_HOME" "value" $hfHome)
      (dict "name" "HF_HUB_ENABLE_HF_TRANSFER" "value" "1")
      (dict "name" "HF_XET_HIGH_PERFORMANCE" "value" "1")
      (dict "name" "HF_XET_NUM_CONCURRENT_RANGE_GETS" "value" "8")
-}}
{{- if $hfSecret -}}
  {{- $env = append $env (dict "name" "HF_TOKEN" "valueFrom" (dict "secretKeyRef" (dict "name" $hfSecret "key" $hfKey))) -}}
{{- end -}}
{{- if $ccEnabled -}}
  {{- /* Pre-create <subPath>/<cacheDir>/<name> on the PVC so the server's
         subPath mount below is guaranteed to exist at container start. */ -}}
  {{- $env = append $env (dict "name" "COMPILE_CACHE_DIR" "value" (printf "%s/%s/%s/%s" $cacheRoot .subPath $cc.cacheDir .name)) -}}
  {{- if $cc.generation -}}
    {{- /* vLLM never cleans its compile cache; wipe it when this key changes. */ -}}
    {{- $env = append $env (dict "name" "COMPILE_CACHE_GENERATION" "value" $cc.generation) -}}
  {{- end -}}
{{- end -}}
{{- $initArgs := list .hfUri .subPath -}}
{{- if $isGguf -}}
  {{- $initArgs = list "gguf" $gguf.repo $gguf.quant .subPath -}}
  {{- if $gguf.file -}}
    {{- $initArgs = append $initArgs "--file" -}}
    {{- $initArgs = append $initArgs $gguf.file -}}
  {{- end -}}
  {{- if $gguf.tokenizerRepo -}}
    {{- $initArgs = append $initArgs "--tokenizer-repo" -}}
    {{- $initArgs = append $initArgs $gguf.tokenizerRepo -}}
  {{- end -}}
  {{- if $gguf.revision -}}
    {{- $initArgs = append $initArgs "--revision" -}}
    {{- $initArgs = append $initArgs $gguf.revision -}}
  {{- end -}}
  {{- range $extra := $gguf.files -}}
    {{- $initArgs = append $initArgs "--extra-file" -}}
    {{- $initArgs = append $initArgs $extra -}}
  {{- end -}}
{{- end -}}
{{- $init := dict
      "name" "populate-hf"
      "image" $image
      "imagePullPolicy" $pullPolicy
      "command" (list "python3" "-u" (printf "%s/populate_hf.py" $scriptMount))
      "args" $initArgs
      "env" $env
      "volumeMounts" (list
          (dict "name" $scriptVol "mountPath" $scriptMount "readOnly" true)
          (dict "name" $cacheVol "mountPath" $cacheRoot))
-}}
{{- with (.initResources | default $defaultInitResources) -}}
  {{- $_ := set $init "resources" . -}}
{{- end -}}
{{- $inits := list $init -}}
{{- /* model spec: user passthrough + chart-forced storageUri + defaults */ -}}
{{- $userModel := deepCopy (.model | default dict) -}}
{{- if $isGguf -}}
  {{- /* GGUF: defaults only apply when the user didn't set them. The runtime
         (kserve-vllmserver) declares modelFormat vLLM/1; the appended
         --model=/mnt/models:<quant> overrides the runtime's --model=/mnt/models
         (argparse last-wins) and --tokenizer=/mnt/models serves the cached
         tokenizer files. */ -}}
  {{- $userModel = mergeOverwrite (dict "modelFormat" (dict "name" "vLLM" "version" "1")) $userModel -}}
  {{- $userModel = mergeOverwrite (dict "runtime" "kserve-vllmserver") $userModel -}}
  {{- $forcedArgs := list (printf "--model=/mnt/models:%s" $gguf.quant) "--tokenizer=/mnt/models" -}}
  {{- $userModel = mergeOverwrite $userModel (dict "args" (concat (default (list) $userModel.args) $forcedArgs)) -}}
{{- else -}}
  {{- $userModel = mergeOverwrite (dict "modelFormat" (dict "name" "huggingface")) $userModel -}}
{{- end -}}
{{- /* Qwen runtime: the shared ServingRuntime only mounts /cache. The model
       mount is per InferenceService so it can use THIS model's subPath instead
       of exposing the whole cache PVC. models[].subPath is the PVC-side cache
       directory; qwen3090.mountPath is the fixed container path qwen expects
       its checkpoint at (they are intentionally different). */ -}}
{{- $qwen := dict -}}
{{- range $rt := $.Values.runtimes -}}
  {{- if and (hasKey $rt "qwen3090") (eq ($rt.name | default "") ($userModel.runtime | default "")) -}}
    {{- $qwen = $rt.qwen3090 -}}
  {{- end -}}
{{- end -}}
{{- if $qwen -}}
  {{- $qwenMounts := concat (default (list) $userModel.volumeMounts) (list (dict
        "name" $cacheVol
        "mountPath" ($qwen.modelPath | default $qwen.mountPath | default "/app/models/Qwen3.8-27B-W4A16-AutoRound-fast")
        "subPath" .subPath
        "readOnly" true)) -}}
  {{- $draft := $qwen.drafter | default dict -}}
  {{- $draftOn := and $draft.hfUri (ne ($draft.enabled | default true) false) -}}
  {{- if and $draftOn (or (not $draft.subPath) (not $draft.mountPath)) -}}
    {{- fail "qwen3090 drafter enabled but needs subPath and mountPath (set both, or drafter.enabled: false)" -}}
  {{- end -}}
  {{- if $draftOn -}}
    {{- /* SPEC=dflash2: qwen's launcher scans /app/models/Qwen3.8-27B-DFlash2-W4A16
           for the drafter and aborts without it (the image's own prepare step
           fetches it, which pods running the chart bypass). A second populate
           init fills drafter.subPath on the shared cache; mount that dir
           read-only off the same kserve-pvc-source volume where the launcher
           looks. */ -}}
    {{- $qwenMounts = concat $qwenMounts (list (dict
          "name" $cacheVol
          "subPath" $draft.subPath
          "mountPath" $draft.mountPath
          "readOnly" true)) -}}
    {{- $draftInit := deepCopy $init -}}
    {{- $draftInit = set $draftInit "name" "populate-hf-drafter" -}}
    {{- $draftInit = set $draftInit "args" (list $draft.hfUri $draft.subPath) -}}
    {{- $inits = append $inits $draftInit -}}
  {{- end -}}
  {{- $userModel = mergeOverwrite $userModel (dict "volumeMounts" $qwenMounts) -}}
{{- end -}}
{{- if $ccEnabled -}}
  {{- /* Persist torch.compile AOT artifacts under <subPath>/<cacheDir>/<name>,
         reusing the existing kserve-pvc-source volume (a second volume for the
         same claim stalls the pod on some backends). KServe's webhook dedups
         volumeMounts by volume name, so once a mount with this name exists it
         skips adding /mnt/models -- which is why BOTH server mounts must be
         rendered here: the read-only model mount the webhook would otherwise
         add, plus the read-write compile-cache mount. */ -}}
  {{- $ccEnv := dict "name" "VLLM_CACHE_ROOT" "value" $cc.mountPath -}}
  {{- $modelMount := dict "name" $cacheVol "mountPath" "/mnt/models" "subPath" .subPath "readOnly" true -}}
  {{- $ccMount := dict "name" $cacheVol "mountPath" $cc.mountPath "subPath" (printf "%s/%s/%s" .subPath $cc.cacheDir .name) -}}
  {{- $userModel = mergeOverwrite $userModel (dict
        "env" (append (default (list) $userModel.env) $ccEnv)
        "volumeMounts" (concat (default (list) $userModel.volumeMounts) (list $modelMount $ccMount))) -}}
{{- end -}}
{{- $userModel = mergeOverwrite $userModel (dict "storageUri" (printf "pvc://%s/%s" $cacheClaim .subPath)) -}}
{{- $modelSpec := $userModel -}}
{{- /* predictor spec: user passthrough + chart-managed volumes/initContainers/model */ -}}
{{- $userPredictor := deepCopy (.predictor | default dict) -}}
{{- $predictorSpec := mergeOverwrite $userPredictor (dict
      "volumes" $volumes
      "initContainers" $inits
      "model" $modelSpec)
-}}
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: {{ .name }}
  labels:
    {{- include "kserve-ns-model-cache.labels" $ | nindent 4 }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  predictor:
    {{- toYaml $predictorSpec | nindent 4 }}
{{ end }}
