# Default values for kserve-ns-model-cache (Option C: pvc:// serving + podspec init).

nameOverride: ""
fullnameOverride: ""

# ConfigMap holding the Python populate script (mounted into the init container).
populateScript:
  # Mount path inside the init container.
  mountPath: /opt/kserve-populate

# Populate init container: runs the ConfigMap script on the STOCK image. No rebuild.
populate:
  image:
    repository: kserve/storage-initializer
    # Match the storage-initializer tag your cluster deploys
    # (inferenceservice-config ConfigMap -> storageInitializer.image).
    tag: latest
    pullPolicy: IfNotPresent
  # Where the cache PVC is mounted (writable) in the init container. The PVC root,
  # so the model is written to <cacheRoot>/<subPath> == the pvc:// subPath.
  cacheRoot: /cache
  # Hugging Face cache dir (HF_HOME). Defaults to <cacheRoot>/.hf-home on the cache
  # PVC, which is already mounted read-write in the init container -- no extra
  # volume. Set explicitly because $HOME is often "/" under OpenShift's random-UID
  # SCC, which would otherwise send the HF cache to the unwritable "/.cache".
  # The global flock serializes downloads per namespace, so the shared on-PVC cache
  # is race-safe. Set to e.g. /tmp for an ephemeral per-pod cache instead.
  hfHome: ""
  # Resources for the populate init container. Empty by default (no limits); set
  # here for all models, or per model via models[].initResources.
  resources: {}

# vLLM torch.compile AOT cache: persist VLLM_CACHE_ROOT on the same cache PVC,
# inside each model's own subPath, so the ~5 minute compilation happens once per
# model config, not once per pod. The first pod pays the compile cost; every
# later pod (scale-out, restart, new node) reuses the artifacts.
#
# Layout on the PVC: <subPath>/<cacheDir>/<model name>/  (e.g.
# hf/qwen3-8b-gguf/cache/qwen3-8b-gguf/), reusing the existing kserve-pvc-source
# volume -- a second volume for the same claim stalls the pod on some backends.
# When enabled, the chart renders both kserve-container mounts itself: the
# read-only /mnt/models model mount the webhook would normally add (KServe
# dedups volumeMounts by volume name, so it skips adding it once a mount with
# that name exists) and the read-write compile cache mount at mountPath.
# VLLM_CACHE_ROOT is the static container path <mountPath>. The populate init
# pre-creates the directory so the server's subPath mount always resolves.
vllm:
  compileCache:
    enabled: false
    # Static VLLM_CACHE_ROOT path inside kserve-container; the per-model
    # separation comes from the mount subPath, not the env value.
    mountPath: /mnt/cache
    # Relative directory under the model subPath; the model name is appended.
    cacheDir: cache
    # vLLM never cleans its compile cache. Set generation to a value that changes
    # whenever the serving image or compile-relevant engine args change (e.g. the
    # image tag); the populate init wipes that model's torch_compile_cache once
    # when it differs from the recorded marker. An unchanged model keeps its
    # cache indefinitely. Empty disables invalidation.
    generation: ""

# Optional ServingRuntimes rendered by templates/servingruntimes.yaml.
#
# A models[].model.runtime value references one of these by .name. The qwen-3090
# entry uses the qwen3090: preset block: the chart expands it into the full
# ServingRuntime spec (image, entrypoint mode single|batch, served model name,
# probes, and the /cache mount). The model mount is per InferenceService: each
# qwen model's ISVC mounts only its models[].subPath (PVC-side cache dir) at
# qwen3090.mountPath (the fixed container path qwen expects), so the rest of the
# shared cache PVC is not exposed. Knative injects PORT=8080 itself; the qwen
# launcher picks that up, so no PORT env or port arg is set here.
runtimes:
  - name: qwen-3090
    qwen3090:
      mode: single          # single = single-user/start_qwen.sh, batch = batch/start_qwen.sh
      image:
        repository: ghcr.io/syv-ai/qwen38-27b-rtx3090
        tag: latest
        pullPolicy: IfNotPresent
      # Exact container path qwen expects its checkpoint at. Each qwen model's
      # models[].subPath is mounted here regardless of the PVC-side cache dir
      # name. single mode serves the -fast variant; use the base directory name
      # for mode: batch.
      mountPath: /app/models/Qwen3.8-27B-W4A16-AutoRound-fast
      servedModelName: qwen3.8-27b
      # Optional absolute MODEL override; when set it should match mountPath.
      modelPath: ""
      # DFlash2 block drafter for SPEC=dflash2 single mode (the recommended
      # profile). The image's own prepare step fetches it by default
      # (docker/prepare.sh, DFLASH2=1); pods running the chart bypass that
      # step, so a second populate init downloads drafter.hfUri into
      # drafter.subPath on the shared cache PVC (one fetch per namespace), and
      # every ISVC on this runtime mounts that dir read-only at
      # drafter.mountPath — the path single-user/start_qwen.sh probes and
      # aborts without for SPEC=dflash2. Keep mountPath as-is (it is the
      # launcher default) or set DRAFT= in the model env to wherever you moved
      # it. drafter.enabled: false skips the ~1.2 GB fetch for a
      # SPEC=mtp-only deployment.
      drafter:
        enabled: true
        hfUri: hf://syvai/Qwen3.8-27B-DFlash2-W4A16
        subPath: hf/qwen3-dflash2
        mountPath: /app/models/Qwen3.8-27B-DFlash2-W4A16

# Shared cache PVC (one per namespace; all models share it).
cache:
  pvc:
    name: model-cache
    # Use an existing PVC instead of creating one (takes precedence over name).
    existingClaim: ""
    # RWX-capable provisioner: nfs-csi, cephfs, efs, azurefile, ...
    storageClassName: ""
    # Access modes. ReadWriteMany shares the cache across nodes; ReadWriteOnce is
    # enough when every pod using the cache is scheduled on the same node
    # (node-level cache).
    accessModes:
      - ReadWriteMany
    size: 500Gi

# Hugging Face token for gated repos. KServe's own credential builder injects
# HF_TOKEN from any ServiceAccount secret whose data has an "HF_TOKEN" key -- but
# only into the webhook-created storage-initializer, which pvc:// does NOT create.
# So this chart wires HF_TOKEN into the populate init container explicitly, using
# the same "HF_TOKEN" key so one secret works both ways. Reference an existing
# secret; empty name skips injecting HF_TOKEN. Create it with:
#   kubectl create secret generic hf-secret --from-literal=HF_TOKEN=hf_xxx
hf:
  tokenSecret:
    name: ""
    key: HF_TOKEN

# One InferenceService per entry, all sharing the cache PVC + populate script.
#
# Required:
#   name      ISVC name
#   hfUri     source URI the init container downloads, e.g. hf://owner/model[:revision]
#   subPath   path inside the PVC for this model -- the SHARED KEY: it is both the
#             init container's download destination and the pvc:// subPath the
#             webhook mounts at /mnt/models. Rendered from this one value.
#
# GGUF (vLLM + vllm-gguf-plugin) instead of hfUri:
#   gguf:
#     repo: unsloth/Qwen3-8B-GGUF   # HF repo containing .gguf weights
#     quant: Q8_0                    # ONE quantized file to cache/serve (Q8_0, Q4_K_M, ...)
#     file: ""                       # optional exact repo-relative filename override
#     tokenizerRepo: ""              # tokenizer/config source, defaults to repo; set to
#                                    # the official base repo when the GGUF repo does not
#                                    # ship tokenizer files (e.g. Qwen/Qwen3.8-27B)
#     revision: ""                   # optional HF revision for all downloads
#     files: []                      # optional extra repo-relative files to cache
#   Only the selected quant (plus shards, if split) and the small tokenizer/config
#   files are downloaded to the cache -- never the whole multi-quant repo. The chart
#   appends --model=/mnt/models:<quant> --tokenizer=/mnt/models to the model args and
#   defaults model.runtime to kserve-vllmserver (the plugin-enabled vLLM runtime);
#   set model.runtime to override for a differently-named runtime. Multimodal
#   projector files (*mmproj*.gguf) are auto-detected and cached beside the backbone
#   (best precision BF16 > F16 > F32); use files: to pin an exact one instead.
#   The tokenizer allowlist also includes multimodal processor configs
#   (preprocessor/processor/video_preprocessor_config.json) and the GPT-2-style
#   BPE fallback (vocab.json + merges.txt), all best-effort. Auxiliary .gguf files
#   such as imatrix_*.gguf are quantization-time inputs, not needed at serve time,
#   and are NOT auto-downloaded; list them in files: if you want them on the cache.
#   The ready marker stores a cache-format version + source fingerprint, so
#   changing gguf.repo/quant/file/tokenizerRepo/revision/files (or upgrading to a
#   populate script with a bumped CACHE_FORMAT_VERSION) re-downloads that subPath
#   on the next pod start. File hashes (HF etags) are checked via metadata-only
#   API calls on every pod start -- file content is downloaded only when a cached
#   file changed or went missing. subPath is the cache key: multiple quants of the
#   same model (same repo/tokenizerRepo/revision) may share one subPath and are
#   added side by side; a different repo/tokenizer source on the same subPath
#   fails at render time.
#
# Pass-through (merged into the rendered InferenceService; the chart only forces
# predictor.volumes/initContainers and model.storageUri, and defaults
# model.modelFormat to huggingface):
#   predictor      -> spec.predictor   (e.g. minReplicas, maxReplicas, affinity, ...)
#   model          -> spec.predictor.model (e.g. modelFormat, args, env, resources, ...)
#   initResources  -> resources for the populate init container
#   annotations    -> ISVC metadata.annotations
models:
  - name: mellum
    hfUri: hf://JetBrains/Mellum2-12B-A2.5B-Thinking
    subPath: hf/mellum
    predictor:
      minReplicas: 0
    model:
      modelFormat:
        name: huggingface
      args:
        - --max-model-len=131072
        - --reasoning-parser=qwen3
        - --enable-auto-tool-choice
        - --tool-call-parser=hermes
      resources:
        requests:
          cpu: "4"
          memory: 4Gi
        limits:
          cpu: "4"
          memory: 20Gi
          nvidia.com/gpu.shared: "1"
  - name: qwen38-27b
    hfUri: hf://dbirks/Qwen3.8-27B-W4A16-AutoRound
    # PVC-side cache directory for this checkpoint. The qwen-3090 runtime (see
    # runtimes[]) mounts THIS subPath at qwen3090.mountPath; the two names do
    # not have to match.
    subPath: Qwen3.8-27B-W4A16-AutoRound
    predictor:
      minReplicas: 0
    model:
      modelFormat:
        name: vLLM
        version: "1"
      runtime: qwen-3090
      resources:
        requests:
          cpu: "4"
          memory: 8Gi
        limits:
          cpu: "4"
          memory: 32Gi
          nvidia.com/gpu: "1"
